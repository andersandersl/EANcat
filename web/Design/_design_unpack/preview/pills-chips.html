<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { width: 110px; font: var(--type-mono); font-size: 11px; color: hsl(var(--muted-foreground)); }

  /* Margin pill — country code on left, value right, fixed-width */
  .mpill {
    display: inline-flex; align-items: center; justify-content: space-between;
    height: 20px; width: 80px; padding: 0 6px;
    border-radius: 4px;
    font: 700 10px "Inter";
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
  }
  .mp-emerald { background:#A7F3D0; color:#064E3B; box-shadow: inset 0 0 0 2px #10B98199; }
  .mp-amber   { background:#FDE68A; color:#78350F; box-shadow: inset 0 0 0 2px #F59E0B99; }
  .mp-rose    { background:#FECDD3; color:#881337; box-shadow: inset 0 0 0 2px #EF444499; }
  .mp-emerald-i { background:#ECFDF5; color:#04785780; box-shadow: inset 0 0 0 1px #A7F3D080; }
  .mp-amber-i   { background:#FFFBEB; color:#78350F80; box-shadow: inset 0 0 0 1px #FCD34D80; }
  .mp-rose-i    { background:#FFF1F2; color:#88133780; box-shadow: inset 0 0 0 1px #FECACA80; }
  .mp-zinc-i    { background:#F4F4F5; color:#71717A99; box-shadow: inset 0 0 0 1px #D4D4D899; }

  /* Stock chip */
  .stock {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; min-width: 40px; padding: 0 8px;
    border-radius: 4px;
    font: 600 12px "Inter";
    font-variant-numeric: tabular-nums;
  }
  .stock-green { background:#10B98126; color:#047857; box-shadow: inset 0 0 0 1px #10B98166; }
  .stock-amber { background:#F59E0B26; color:#92400E; box-shadow: inset 0 0 0 1px #F59E0B66; }
  .stock-rose  { background:#EF444426; color:#BE123C; box-shadow: inset 0 0 0 1px #EF444466; }

  /* Brand tag from ProductRow */
  .brand-tag {
    display: inline-flex; align-items: center;
    padding: 1px 8px;
    border-radius: 4px;
    background: #1A5EFF1A;
    color: #1A5EFF;
    border: 1px solid #1A5EFF4D;
    font: 500 11px "Inter";
  }

  /* Feed status pills */
  .feed {
    display: inline-flex; align-items: center;
    height: 22px; padding: 0 10px;
    border-radius: 9999px;
    font: 600 12px "Inter";
    gap: 4px;
  }
  .feed-on  { background:#10B98126; color:#047857; box-shadow: inset 0 0 0 1px #10B98166; }
  .feed-off { background:#EF444426; color:#BE123C; box-shadow: inset 0 0 0 1px #EF444466; }
  .feed-add {
    background:#fff; color:hsl(var(--muted-foreground));
    border: 1px solid #DDE0E7; height: 26px; width: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px;
  }
</style>
</head><body>
  <div class="stack">
    <div class="row">
      <span class="lbl">margin · active</span>
      <span class="mpill mp-emerald">SE +24.5%</span>
      <span class="mpill mp-amber">DK +8.1%</span>
      <span class="mpill mp-rose">FI −3.2%</span>
    </div>
    <div class="row">
      <span class="lbl">margin · muted</span>
      <span class="mpill mp-emerald-i">SE +24.5%</span>
      <span class="mpill mp-amber-i">DK +8.1%</span>
      <span class="mpill mp-rose-i">FI −3.2%</span>
      <span class="mpill mp-zinc-i">FI —</span>
    </div>
    <div class="row">
      <span class="lbl">stock chip</span>
      <span class="stock stock-green">62</span>
      <span class="stock stock-amber">4</span>
      <span class="stock stock-rose">Out</span>
    </div>
    <div class="row">
      <span class="lbl">brand tag</span>
      <span class="brand-tag">LOGITECH</span>
      <span class="brand-tag">APPLE</span>
      <span class="brand-tag">SENNHEISER</span>
    </div>
    <div class="row">
      <span class="lbl">feed status</span>
      <span class="feed feed-on">✓ on</span>
      <span class="feed feed-off">× off</span>
      <span class="feed-add">+</span>
    </div>
  </div>
</body></html>
