<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; background: hsl(var(--background)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .card {
    background: #fff;
    border: 1px solid #DDE0E7;
    border-radius: 8px;
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
    padding: 12px;
  }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .eyebrow {
    font: 600 11px "Inter"; letter-spacing: 0.06em; text-transform: uppercase;
    color: hsl(var(--muted-foreground));
  }
  .count { font: 600 14px "Inter"; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: #EAECF1; border-radius: 9999px; overflow: hidden; }
  .fill { height: 100%; }
  .note { font: 400 11px "Inter"; color: hsl(var(--muted-foreground)); margin-top: 6px; }

  .ok    .count { color: #047857; }
  .ok    .fill  { background: #10B981; width: 47%; }
  .warn  .count { color: #92400E; }
  .warn  .fill  { background: #F59E0B; width: 86%; }
  .full  .count { color: #BE123C; }
  .full  .fill  { background: #EF4444; width: 100%; }
</style></head>
<body>
  <div class="grid">
    <div class="card ok">
      <div class="head"><span class="eyebrow">Feed</span><span class="count">47 / 100</span></div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="card warn">
      <div class="head"><span class="eyebrow">Feed</span><span class="count">86 / 100</span></div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="card full">
      <div class="head"><span class="eyebrow">Feed</span><span class="count">100 / 100</span></div>
      <div class="bar"><div class="fill"></div></div>
      <p class="note">Feed is full — remove a product first.</p>
    </div>
  </div>
</body></html>
